---
name: fuzz
# ClusterFuzzLite: builds the cargo-fuzz targets in fuzz/ and runs each for
# a short burst on every pull request and master push, seeded by the corpus
# that cflite_cron.yml accumulates. A crash fails the job and is uploaded as
# an artifact. Address is the only sanitizer worth a leg here: it already
# covers leaks, rustc has no UBSan backend, and MSan/TSan would need a fully
# instrumented std.
on:
  pull_request:
  push:
    branches: [master]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let master runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          language: rust
          sanitizer: ${{ matrix.sanitizer }}
          # Without it the coverage lookup 401s: the artifacts API rejects
          # unauthenticated reads even on a public repo.
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1  # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
